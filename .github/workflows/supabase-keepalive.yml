name: Supabase Keep-Alive

'on':
  schedule:
    # Twice a week, well within Supabase's free-tier 7-day inactivity window.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/stables?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
